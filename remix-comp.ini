[Lights]
; Inject dynamic point lights into the D3D9 FFP pipeline for RTX Remix path tracing.
Enabled=1

; Multiplier applied to the light's diffuse colour (100 = 1.0x, 200 = 2.0x).
; Increase if lights appear too dim in the path-traced scene.
IntensityPercent=100

; Light range in Halo world units (1 unit ≈ 10 feet / 3 metres in Halo CE).
; At the default of 10 a light reaches roughly 30 metres.
RangeDefault=10

; Mirror the player's flashlight (D3DLIGHT_SPOT) as a point light.
; RTX Remix path-traces point lights but may ignore spotlight types.
; Set to 0 to disable if the flashlight is already working correctly.
FlashlightEnabled=1

; Flashlight point-mirror range in world units.
FlashlightRange=8
